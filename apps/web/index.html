<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- The saved theme, applied before the first paint (a file: the CSP allows no inline scripts). -->
    <script src="/theme-boot.js"></script>
    <!-- Add to Home Screen: opens full-screen like an app (no service worker; see docs/remote-access.md). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d0e12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CodeDen" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>CodeDen</title>
    <style>
      #startup-fallback {
        visibility: hidden;
        animation: show-startup-fallback 0s 1.5s forwards;
      }
      @keyframes show-startup-fallback {
        to { visibility: visible; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="startup-fallback">
        <h1>CodeDen is loading</h1>
        <p>If this page stays here, <a href="/">open CodeDen again</a>.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
